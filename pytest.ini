[pytest]
; Root anchor for every pytest invocation in this repository.
;
; Without an ini file, pytest derives rootdir from the common ancestor of the
; given test paths. When a check runs, for example,
;     python -m pytest tests/unit/test_plant_mapping.py --localstack
; from an absolute path or a sub-directory, that ancestor is not the repository
; root, so the root conftest.py is outside confcutdir and is never collected.
; The suite options (--localstack / --api-base-url) and the session fixtures that
; read them then do not exist and pytest aborts during argument parsing with
;     error: unrecognized arguments: --localstack
;
; Declaring this file at the repository root makes pytest resolve inifile and
; rootdir to the root from every invocation, so the root conftest.py is always
; loaded and is the single place that registers options and markers.
minversion = 7.0
testpaths = tests
pythonpath =
    .
    src
    tests
asyncio_mode = auto
norecursedirs =
    .git
    .p3
    build
    dist
    node_modules
    frontend
    *.egg-info
    .pytest_cache
    .ruff_cache
    __pycache__
addopts = -ra
markers =
    integration: tests that require the Compose support services (LocalStack/RDS)
    e2e: Playwright browser journeys
    slow: long running tests
